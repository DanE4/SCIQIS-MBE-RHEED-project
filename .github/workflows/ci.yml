name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest
      - name: Check source and notebook
        run: make check
      - name: Export notebook
        run: make export
      - name: Reproduce baseline
        run: make reproduce

