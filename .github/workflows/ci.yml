name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Makefile is only a wrapper around these commands and Windows runners have no make,
    # so the steps below call uv directly. bash is present on all three runners.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install pinned Python
        run: uv python install
      - name: Sync locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Run tests
        run: uv run pytest
      - name: Check the notebook
        run: |
          uv run marimo check --strict notebooks/mbe_rheed.py
          uv run python notebooks/mbe_rheed.py
      - name: Export the notebook
        run: |
          mkdir -p outputs
          uv run marimo export html notebooks/mbe_rheed.py -o outputs/mbe_rheed.html -f
      - name: Reproduce the baseline
        run: uv run python scripts/run_workflow.py baseline
